# Temporary one-shot: reproduce SkillNerds/xskill#46 on macOS.
# Safe to delete after the run.

name: Repro issue 46 (macOS)

on:
  workflow_dispatch:
  push:
    branches: [repro/issue-46-macos]

jobs:
  repro-current-source:
    name: current source on macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package from source
        run: pip install -e ".[dev]"
      - name: Reproduce against current tree
        env:
          XSKILL_HOME: ${{ runner.temp }}/xskill-home-current
        run: python scripts/repro_issue_46.py --mode current

  repro-0-5-2:
    name: xskill==0.5.2 on macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reported version
        run: pip install "xskill==0.5.2"
      - name: Reproduce against 0.5.2
        env:
          XSKILL_HOME: ${{ runner.temp }}/xskill-home-052
        run: python scripts/repro_issue_46.py --mode legacy-0.5.2
